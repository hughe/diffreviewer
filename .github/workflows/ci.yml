---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: true

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        run: make build-frontend

      - name: Run Go tests
        run: make test

      - name: Build backend
        run: make build-backend

      - name: Verify binary exists
        run: |
          if [ ! -f bin/diffreviewer ]; then
            echo "Error: Binary not found at bin/diffreviewer"
            exit 1
          fi
          echo "Binary built successfully"
          ls -lh bin/diffreviewer
