---
name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'
          cache: true

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        run: make build-frontend

      - name: Run Go tests
        run: make test

      - name: Build backend
        run: make build-backend

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -f bin/diffreviewer ]; then
            echo "Error: Binary not found at bin/diffreviewer"
            exit 1
          fi
          echo "Binary built successfully"
          ls -lh bin/diffreviewer

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path bin/diffreviewer.exe)) {
            Write-Error "Binary not found at bin/diffreviewer.exe"
            exit 1
          }
          Write-Output "Binary built successfully"
          Get-Item bin/diffreviewer.exe | Format-List
        shell: pwsh
